<header><b>OIA</b> Operação de distribuição <span>Base Oiapoque · Amapá</span></header><main>
<div class="bar"><h1>Produção diária por equipe</h1></div>
<div class="imports"><div><label for="loadActs">Base diária de atividades</label><small>Selecione uma ou mais planilhas Atividades-Oiapoque (.xlsx).</small></div><button class="primary" id="loadActs">Importar base diária</button><button id="deleteBase" class="danger-outline">Excluir base diária</button><button class="secondary" id="loadRates">Importar tabela de referência</button></div>

<div class="filters"><label>Competência<select id="month"></select></label><label>Dia de produção<select id="day"></select></label><label>Equipe<select id="team"></select></label></div>
<nav aria-label="Seções"><button data-tab="summary">Visão diária</button><button data-tab="monthly">Resumo mensal</button><button data-tab="activities">Atividades</button><button data-tab="review">Conferência</button><button data-tab="catalog">Tabela UPS</button></nav><section id="content"></section>

 const files=[...input.files];if(!files.length)return;$('deleteBase').disabled=$('loadActs').disabled=$('loadRates').disabled=true;$('msg').textContent='Lendo planilhas…';let filename='';
 try{let info,date;if(isRate){filename=files[0].name;const rates=await catalog(files[0]);commit({...state,rates});info=rates.length+' valores de referência carregados.'}else{
 const records=new Map(state.rows.map(r=>[r.id,r])),reviews={...state.reviews};let inserted=0,updated=0;
 for(const file of files){filename=file.name;for(const r of await activities(file)){const old=records.get(r.id);if(old){updated++;if(['type','team','status','scope','result','place','cause','date','executed','other','conclusion','code','group','mode','obs'].some(k=>old[k]!==r[k]))delete reviews[r.id]}else inserted++;records.set(r.id,r);if(!date||r.date>date)date=r.date}}
 commit({...state,rows:[...records.values()],reviews});info=inserted+' novos · '+updated+' registros atualizados.'}filters(date);render();$('msg').textContent=info
 }catch(e){$('msg').textContent='Importação não aplicada. '+filename+' — '+e.message}finally{input.value='';$('deleteBase').disabled=$('loadActs').disabled=$('loadRates').disabled=false}
}
$('loadActs').onclick=()=>$('files').click();$('loadRates').onclick=()=>$('rateFile').click();$('files').onchange=e=>ingest(e.target,false);$('rateFile').onchange=e=>ingest(e.target,true);filters();render();
</script></html>
